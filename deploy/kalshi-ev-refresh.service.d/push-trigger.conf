# Fire the Expo push worker the instant the +EV scan finishes. softbook_ev_today.py
# sends the instant 🟣 Telegram alerts inline (rec.alert_new_high) at :00/:20/:40;
# without this, the app push only went out on push.timer's next 5-min tick, so the
# app notification trailed Telegram by ~5 min. push_worker dedups via pushed_high
# (idempotent) and the 5-min timer stays as a backstop. Revert: rm this file + daemon-reload.
[Service]
ExecStartPost=-/usr/bin/systemctl start --no-block kalshi-softbook-push.service
