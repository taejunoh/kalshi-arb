name: atm_hold_v1 monitor
on:
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check dashboard and send Telegram
        run: |
          set +e
          NOW_UTC=$(date -u '+%Y-%m-%dT%H:%M UTC')
          curl -s -o /tmp/resp.json --max-time 15 "http://3.146.180.145:8080/api/strategy-monitor/atm_hold_v1?since=2026-05-19T00:00:00"
          CURL_EXIT=$?
          set -e
          if [[ $CURL_EXIT -ne 0 ]] || [[ ! -s /tmp/resp.json ]]; then
            MSG="atm_hold_v1 6h monitor (${NOW_UTC}): dashboard endpoint no response (curl_exit=${CURL_EXIT}). EC2 check needed."
            curl -s -X POST "https://api.telegram.org/botTELEGRAM_BOT_TOKEN_REDACTED/sendMessage" \
              -d "chat_id=8578917235" \
              --data-urlencode "text=${MSG}"
            echo "Telegram sent (endpoint down alert)"
            exit 0
          fi
          ROLLBACK=$(jq -r '.rollback_triggers.any_rollback_signal // false' /tmp/resp.json)
          N=$(jq -r '.live.n // "0"' /tmp/resp.json)
          WR=$(jq -r '.live.wr_pct // "-"' /tmp/resp.json)
          NET=$(jq -r '.live.sum_pnl // "-"' /tmp/resp.json)
          WIPE=$(jq -r '.live.wipe_zero_pct // "-"' /tmp/resp.json)
          FILL=$(jq -r '.fill_rate_pct // "-"' /tmp/resp.json)
          RATIO=$(jq -r '.live_vs_paper_ratio // "-"' /tmp/resp.json)
          WORST=$(jq -r '.live.worst_pnl // "-"' /tmp/resp.json)
          UNSETTLED=$(jq -r '.unsettled_count // "-"' /tmp/resp.json)
          if [[ "$ROLLBACK" == "true" ]]; then
            TRIGGERS=$(jq -r '.rollback_triggers | to_entries[] | select(.value == true and .key != "any_rollback_signal") | .key' /tmp/resp.json | paste -sd,)
            MSG="atm_hold_v1 ROLLBACK trigger fired ${NOW_UTC} | triggers=${TRIGGERS} | LIVE n=${N} WR=${WR}% NET=${NET} Wipe=${WIPE}% Worst=${WORST} Fill=${FILL}% Ratio=${RATIO} | Action: ssh ubuntu@3.146.180.145 && sed -i 's/,atm_hold_v1//' .env && sudo systemctl restart kalshi-bot"
          else
            if [[ "$N" == "0" ]]; then
              MSG="atm_hold_v1 OK ${NOW_UTC} | LIVE n=0 (settle pending) unsettled=${UNSETTLED} | Wipe=${WIPE}% Fill=${FILL}% Ratio=${RATIO} | next check +6h"
            else
              MSG="atm_hold_v1 OK ${NOW_UTC} | LIVE n=${N} WR=${WR}% NET=${NET} | Wipe=${WIPE}% Fill=${FILL}% Ratio=${RATIO} | next check +6h"
            fi
          fi
          RESP=$(curl -s -X POST "https://api.telegram.org/botTELEGRAM_BOT_TOKEN_REDACTED/sendMessage" \
            -d "chat_id=8578917235" \
            --data-urlencode "text=${MSG}")
          echo "Telegram: $RESP"
          cat /tmp/resp.json
